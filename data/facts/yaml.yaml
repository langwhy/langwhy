trades_away:
  - quote: "Since in a YAML representation , mapping keys are unordered and nodes may be referenced more than once (have more than one incoming “arrow”), the serialization process is required to impose an ordering on the mapping keys"
    source: https://yaml.org/spec/1.2.2/
    checked: 2026-11-06
  - quote: "In particular, mapping key order, comments and tag handles should not be referenced during construction."
    source: https://yaml.org/spec/1.2.2/
    checked: 2026-11-06
