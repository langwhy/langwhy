    source: https://chapel-lang.org/publications/PMfPC-Chapel.pdf
    checked: 2026-11-06
trades_away:
  - quote: "yet intentionally avoids basing the language on a pure object-oriented paradigm (as with Smalltalk or Java)"
    source: https://chapel-lang.org/publications/PMfPC-Chapel.pdf
    checked: 2026-11-06
used_by:
