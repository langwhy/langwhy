trades_away:
  - quote: "As a programming language LISP had many limitations. Some of the most evident in the early 1960s were ultra-slow numerical computation, inability to represent objects by blocks of registers and garbage collect the blocks, and lack of a good system for input-output of symbolic expressions in conventional notations."
    source: https://www-formal.stanford.edu/jmc/history/lisp/node5.html
    checked: 2026-11-06
