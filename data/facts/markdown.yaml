    source: https://daringfireball.net/projects/markdown/
    checked: 2026-11-06
  - quote: "The overriding design goal for Markdown’s formatting syntax is to make it as readable as possible."
    source: https://daringfireball.net/projects/markdown/
    checked: 2026-11-06
trades_away:
  - quote: "Markdown is not a replacement for HTML, or even close to it."
    source: https://daringfireball.net/projects/markdown/syntax
    checked: 2026-11-06
  - quote: "HTML is a publishing format; Markdown is a writing format."
    source: https://daringfireball.net/projects/markdown/syntax
    checked: 2026-11-06
used_by:
