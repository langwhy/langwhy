    quote: "GitHub Flavored Markdown, often shortened as GFM, is the dialect of Markdown that is currently supported for user content on GitHub.com and GitHub Enterprise."
    source: https://github.github.com/gfm/
    checked: 2026-11-06
  - who: GitLab
    quote: "When you enter text in the GitLab UI, GitLab assumes the text is in GitLab Flavored Markdown."
    source: https://docs.gitlab.com/user/markdown/
