id: c
name: C
appeared: 1972
creators: [Dennis Ritchie]
type: systems
status: stable
tagline: Programming language for operating systems and other code that has to work close to the hardware.
born_from: >-
  In 1969 Ken Thompson created the B language at Bell Labs, and B had no types. The PDP-11's byte addressing exposed B's limits, so Dennis Ritchie added types, int and char, and wrote C, and in 1973 the Unix kernel was rewritten in it.
reacts_to: [b, bcpl]
tradeoffs:
  memory: manual
  types: static
  run: native
  concurrency: [threads]
  cost: "No bounds checks and no memory ownership rules, so buffer overflows and use-after-free bugs are the programmer's job, and undefined behaviour often compiles without an error."
slots:
  - slot: systems
    fit: strong
    note: "The Linux kernel is written in C, and so was the Unix kernel after 1973."
  - slot: embedded
    fit: strong
    note: "Microcontroller code is commonly written in C."
  - slot: server
    fit: ok
    note: "Nginx, a web server, and Redis, a data store, are written in C."
  - slot: database
    fit: ok
    note: "SQLite and PostgreSQL, two widely used databases, are written in C."
  - slot: cli
    fit: ok
    note: "Core Unix tools such as ls and grep are C programs."
  - slot: compute
    fit: ok
    note: "llama.cpp, which runs AI models on ordinary computers, is written in C and C++."
  - slot: wasm
    fit: ok
    note: "Clang and Emscripten compile C to WebAssembly."
  - slot: games
    fit: ok
    note: "Raylib, a small game library, is written in C."
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Browsers run only JavaScript and WebAssembly. C gets into a web page by being compiled to WebAssembly, and JavaScript still loads it."
    source: https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts
  - slot: mobile
    fit: weak
    reason: no-tools
    note: "Android apps use C code through the NDK, a separate native kit that Java code calls into."
    source: https://developer.android.com/ndk/guides
  - slot: scripts
    fit: weak
    reason: overkill
    note: "C programs are compiled and linked into an executable before they run, so a quick task needs a build step first."
    source: https://gcc.gnu.org/onlinedocs/gcc/Overall-Options.html
  - slot: data
    fit: weak
    reason: overkill
    note: "Data work means trying one small step after another; C needs a compile for every change. Analysts use Python, whose NumPy is C underneath."
    source: https://numpy.org/
  - slot: config
    fit: none
    reason: no-tools
    note: "Settings files are plain data, and cloud setup tools such as Pulumi take TypeScript, Python, Go, Java or C#, not C."
    source: https://www.pulumi.com/docs/iac/languages-sdks/
won_where:
  - what: "Linux kernel, which its own documentation says is written in the C programming language"
    source: "https://docs.kernel.org/process/programming-language.html"
  - what: "Unix, whose kernel was rewritten in C in 1973"
    source: "https://csapp.cs.cmu.edu/2e/docs/chistory.html"
alternatives: [cpp, rust, zig]
timeline:
  - year: 1969
    what: "Ken Thompson creates the B language at Bell Labs"
    source: "https://csapp.cs.cmu.edu/2e/docs/chistory.html"
  - year: 1972
    what: "Ritchie calls 1972 the most creative period of C's development"
    source: "https://csapp.cs.cmu.edu/2e/docs/chistory.html"
  - year: 1973
    what: "The Unix kernel is rewritten in C for the PDP-11"
    source: "https://csapp.cs.cmu.edu/2e/docs/chistory.html"
  - year: 1978
    what: "Kernighan and Ritchie publish The C Programming Language"
    source: "https://csapp.cs.cmu.edu/2e/docs/chistory.html"
  - year: 1989
    what: "The X3J11 committee finishes its ANSI C standard report"
    source: "https://csapp.cs.cmu.edu/2e/docs/chistory.html"
  - year: 2024
    what: "C23 is adopted as the current ISO standard"
    source: "https://www.open-std.org/jtc1/sc22/wg14/"
links:
  website: https://www.open-std.org/jtc1/sc22/wg14/
pldb: c
sources:
  - https://csapp.cs.cmu.edu/2e/docs/chistory.html
  - https://docs.kernel.org/process/programming-language.html
  - https://www.open-std.org/jtc1/sc22/wg14/
  - https://pldb.io/concepts/c.html
verified: false
last_reviewed: "2026-10-30"
