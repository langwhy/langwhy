id: sql
name: SQL
appeared: 1974
creators:
  - Donald D. Chamberlin
  - Raymond F. Boyce
org: ISO/IEC JTC 1/SC 32 (WG3)
type: query
status: alive
tagline: "Declarative language for defining, changing and querying data in relational databases."
born_from: >-
  In 1970 Edgar Codd of the IBM Research Laboratory in San Jose argued that users of large data banks should not have to know how the data is organized, and he faulted the tree and network systems that made programs follow fixed access paths. In 1974 Donald Chamberlin and Raymond Boyce, also at IBM, published SEQUEL, a structured English query language aimed at occasional users as well as programmers.
reacts_to: []
tradeoffs:
  memory: n/a
  types: n/a
  run: n/a
  concurrency: [n/a]
  cost: "Each database speaks its own dialect, and no relational database fully conforms to the SQL standard yet."
slots:
  - slot: database
    fit: strong
  - slot: data
    fit: strong
    note: "DuckDB embeds SQL in a host process and integrates with Python and R."
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "SQLite runs in browsers as a WebAssembly build, so SQL reaches a page only through an engine like that."
    source: https://www.sqlite.org/wasm/doc/trunk/index.md
  - slot: scripts
    fit: weak
    reason: one-job
    note: "SQL manages data held in a database; a SQL file cannot copy files or call web services the way glue scripts do."
    source: https://en.wikipedia.org/wiki/SQL
  - slot: compute
    fit: weak
    reason: runs-elsewhere
    note: "The RAPIDS plugin for Apache Spark uses GPUs through cuDF to speed up processing, so SQL reaches a GPU only inside that engine."
    source: https://github.com/NVIDIA/spark-rapids
  - slot: embedded
    fit: weak
    reason: too-slow
    note: "SQLite runs in thermostats and drones, but a database engine needs far more memory than a microcontroller with kilobytes has."
    source: https://www.sqlite.org/whentouse.html
  - slot: server
    fit: none
    reason: one-job
    note: "SQL runs inside the database server; it is not a language for writing the server."
    source: https://www.postgresql.org/docs/current/app-psql.html
  - slot: systems
    fit: none
    reason: one-job
    note: "SQL manages data held in a database; it has no way to write drivers or manage memory for the machine."
    source: https://en.wikipedia.org/wiki/SQL
  - slot: mobile
    fit: none
    reason: one-job
    note: "Android apps are built with Kotlin or Java using Google's tools; SQL only manages data held in a database."
    source: https://developer.android.com/kotlin/first
  - slot: cli
    fit: none
    reason: one-job
    note: "psql is the command-line program for PostgreSQL; it sends SQL typed or read from files to a database."
    source: https://www.postgresql.org/docs/current/app-psql.html
  - slot: wasm
    fit: none
    reason: one-job
    note: "WebAssembly is a compilation target for languages such as C, C++ and Rust; SQL is a query language for databases."
    source: https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts
  - slot: config
    fit: none
    reason: one-job
    note: "SQL manages data held in a database; settings files use formats such as TOML, which is aimed at configuration."
    source: https://toml.io/en/
  - slot: games
    fit: none
    reason: one-job
    note: "SQL manages data held in a database; a game draws each frame and reads the player's input in its own code."
    source: https://en.wikipedia.org/wiki/SQL
won_where:
  - what: "SQLite, on every Android device, iPhone, Mac, Windows 10/11 PC, and in Firefox, Chrome and Safari"
    source: https://sqlite.org/mostdeployed.html
  - what: "Oracle Database, introduced in 1979 as the first commercially available SQL-based RDBMS"
    source: https://docs.oracle.com/en/database/oracle/oracle-database/21/cncpt/database-concepts.pdf
  - what: "Google Spanner, which moved to the SQL dialect shared by other Google systems"
    source: https://research.google/pubs/spanner-becoming-a-sql-system/
  - what: "DuckDB, an embedded analytics database that works inside Python and R sessions"
    source: https://duckdb.org/why_duckdb
alternatives: [python, r, julia]
timeline:
  - year: 1970
    what: "Edgar Codd publishes the relational model and argues users should not need to know the data layout"
    source: https://www.engineering.upenn.edu/~zives/03f/cis550/codd.pdf
  - year: 1974
    what: "Chamberlin and Boyce publish SEQUEL, the query language that became SQL"
    source: https://research.ibm.com/publications/sequel-a-struciured-english-query-language
  - year: 1979
    what: "Oracle Version 2 is introduced as the first commercially available SQL-based RDBMS"
    source: https://docs.oracle.com/en/database/oracle/oracle-database/21/cncpt/database-concepts.pdf
  - year: 1986
    what: "ANSI accepts SQL as a standard, ANSI X3.135-1986"
    source: https://www.dbvis.com/thetable/standard-ansi-sql-what-it-is-and-why-it-matters/
  - year: 2017
    what: "Google publishes Spanner: Becoming a SQL System, moving Spanner to the SQL dialect shared across Google"
    source: https://research.google/pubs/spanner-becoming-a-sql-system/
  - year: 2023
    what: "ISO/IEC 9075:2023 is published, the SQL:2023 edition of the standard"
    source: https://www.dbvis.com/thetable/standard-ansi-sql-what-it-is-and-why-it-matters/
links:
