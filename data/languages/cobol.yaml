    source: https://www.ibm.com/think/topics/cobol
  - year: 1968
    what: "COBOL is standardized as a computer language"
    source: https://www.ibm.com/think/topics/cobol
  - year: 2002
    what: "The 2002 COBOL Standard, which IBM's Enterprise COBOL 3 later follows"
    source: https://www.ibm.com/docs/en/SS6SG3_6.5/lr/ref/rlstdim.html
  - year: 2023
    what: "ISO/IEC 1989:2023 is the reference standard for GCC's COBOL compiler, gcobol"
