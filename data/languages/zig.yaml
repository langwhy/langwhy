id: zig
name: Zig
appeared: 2016
creators: [Andrew Kelley]
org: Zig Software Foundation
type: systems
status: alive
tagline: "Systems language meant to replace C, with no hidden control flow or hidden allocations."
born_from: >-
  Andrew Kelley designed Zig to replace C while keeping C's binary interface, so existing C libraries still link. The Zig project argues that C++, Rust and D have so many features that programmers end up debugging their knowledge of the language instead of the application.
reacts_to: [c, cpp, rust, d]
tradeoffs:
  memory: manual
  types: static
  run: native
  concurrency: [threads]
  cost: "Still before 1.0, so the language changes between releases (0.16 in April 2026, 0.17 in October 2026), and every allocation and control path is written out by hand."
slots:
  - slot: systems
    fit: strong
    note: "Zig is designed to replace C, and its compiler moved from C++ to Zig in 2022."
  - slot: server
    fit: ok
  - slot: database
    fit: ok
    note: "TigerBeetle, a financial database, is written in Zig."
  - slot: cli
    fit: ok
  - slot: embedded
    fit: ok
    note: "Zig code can run on small chips and uses no garbage collector."
  - slot: wasm
    fit: ok
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Browsers run only JavaScript and WebAssembly. Zig gets into a web page by being compiled to WebAssembly, and JavaScript still loads it."
    source: https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts
  - slot: mobile
    fit: weak
    reason: no-tools
    note: "Android's app tools are built for Kotlin and Java; Zig is not one of their languages."
    source: https://developer.android.com/kotlin/first
  - slot: scripts
    fit: weak
    reason: overkill
    note: "A Zig program is built into an executable before it runs, as the Hello World example shows, so a quick task needs a build step."
    source: https://ziglang.org/documentation/master/
  - slot: compute
    fit: weak
    reason: no-tools
    note: "GPU programs are written with NVIDIA's CUDA in C++ or Python; Zig reaches a GPU only through code written in those."
    source: https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html
  - slot: games
    fit: weak
    reason: no-tools
    note: "Unreal Engine, a major game engine, has gameplay classes written in C++, not Zig."
    source: https://dev.epicgames.com/documentation/en-us/unreal-engine/programming-with-cplusplus-in-unreal-engine
  - slot: data
    fit: none
    reason: no-tools
    note: "Analysts use Python packages such as NumPy, the base of scientific computing with Python."
    source: https://numpy.org/
  - slot: config
    fit: none
    reason: no-tools
    note: "Settings files are plain data, and cloud setup tools such as Pulumi take TypeScript, Python, Go, Java or C#, not Zig."
    source: https://www.pulumi.com/docs/iac/languages-sdks/
won_where:
  - what: "Ghostty, a terminal emulator whose shared core and Linux app are written in Zig"
    source: "https://ghostty.org/docs/about"
  - what: "Uber, which has compiled all C and C++ in its Go monorepo with the Zig toolchain since January 2023"
    source: "https://www.uber.com/en-KR/blog/bootstrapping-ubers-infrastructure-on-arm64-with-zig/"
alternatives: [c, rust, cpp, go]
timeline:
  - year: 2016
    what: "Zig is first released on 8 February 2016"
    source: "https://github.com/topics/zig-lang"
  - year: 2020
    what: "The Zig Software Foundation is announced to promote and advance the language"
    source: "https://ziglang.org/news/announcing-zig-software-foundation/"
  - year: 2022
    what: "The compiler moves from about 80,000 lines of C++ to a 250,000-line version written in Zig"
    source: "https://ziglang.org/news/goodbye-cpp/"
  - year: 2026
    what: "Zig 0.17.0 is released, after 0.16.0 in April 2026"
    source: "https://ziglang.org/news/"
links:
  website: https://ziglang.org
  wikipedia: https://en.wikipedia.org/wiki/Zig_(programming_language)
pldb: zig
sources:
  - https://ziglang.org/learn/overview/
  - https://ziglang.org/learn/why_zig_rust_d_cpp/
  - https://en.wikipedia.org/wiki/Zig_(programming_language)
  - https://github.com/topics/zig-lang
  - https://ziglang.org/news/announcing-zig-software-foundation/
  - https://ziglang.org/news/goodbye-cpp/
  - https://ziglang.org/news/
  - https://ghostty.org/docs/about
  - https://www.uber.com/en-KR/blog/bootstrapping-ubers-infrastructure-on-arm64-with-zig/
  - https://pldb.io/concepts/zig.html
verified: false
last_reviewed: "2026-10-30"
