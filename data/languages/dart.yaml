id: dart
name: Dart
appeared: 2011
creators: [Lars Bak]
org: Google
type: mobile
status: alive
tagline: "Language for building Flutter apps, compiled ahead of time to native code or to JavaScript."
born_from: >-
  Google's 2011 launch post, by Lars Bak of the Dart team, set out to create a structured yet flexible language for web programming with high performance on all browsers. In 2015 the Dart team decided not to integrate the Dart VM into Chrome and kept Dart compiling to JavaScript for the web.
reacts_to: [javascript]
tradeoffs:
  memory: gc
  types: static
  run: native
  concurrency: [async, actors]
  cost: "Outside Flutter, Dart has a small library ecosystem and hiring pool, so a Dart team is mostly a Flutter team."
slots:
  - slot: mobile
    fit: strong
    note: "Flutter apps are written in Dart."
  - slot: server
    fit: ok
    note: "Shelf, Dart Frog and Serverpod are Dart server packages; Serverpod targets backends for Flutter apps."
  - slot: cli
    fit: ok
    note: "dart compile exe builds a standalone program for the command line."
  - slot: scripts
    fit: ok
    note: "dart run runs a single file without a project; the Dart SDK has to be installed first."
  - slot: wasm
    fit: ok
    note: "Dart code can be compiled to WebAssembly as well as to JavaScript for the web."
  - slot: games
    fit: ok
    note: "Flame is a game engine built on Flutter that runs on mobile, desktop and web."
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Google decided not to put the Dart VM into Chrome, so Dart reaches web pages by compiling to JavaScript."
    source: https://news.dartlang.org/2015/03/dart-for-entire-web.html
  - slot: database
    fit: weak
    reason: runs-elsewhere
    note: "Dart apps reach relational databases through drift, a persistence library built on packages such as sqlite3."
    source: https://drift.simonbinder.eu/
  - slot: systems
    fit: weak
    reason: hides-machine
    note: "Dart reclaims unused memory with a garbage collector, so programs do not free it by hand."
    source: https://dart.dev/overview
  - slot: data
    fit: none
    reason: no-tools
    note: "NumPy, the fundamental package for scientific computing, is built for Python."
    source: https://numpy.org/
  - slot: compute
    fit: none
    reason: no-tools
    note: "GPU programs are written with NVIDIA's CUDA in C++ or Python; Dart has no way into that work."
    source: https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html
  - slot: embedded
    fit: none
    reason: too-slow
    note: "Dart programs carry a runtime for type checks and garbage collection, too much for a chip with kilobytes of memory."
    source: https://dart.dev/tools/dart-compile
  - slot: config
    fit: none
    reason: no-tools
    note: "Dart projects keep their settings in pubspec.yaml, a data file, and cloud setup tools such as Pulumi do not take Dart."
    source: https://dart.dev/tools/pub/pubspec
won_where:
  - what: "Google Pay, a Flutter case study on the official showcase"
    source: https://flutter.dev/showcase
  - what: "BMW Group, a Flutter case study on scaling customer-facing product development"
    source: https://flutter.dev/showcase
  - what: "Alibaba, which scaled China's largest second-hand marketplace with Flutter"
    source: https://flutter.dev/showcase
alternatives: [kotlin, swift, typescript, javascript]
timeline:
  - year: 2011
    what: "Google announces Dart on October 10 as a language for web applications"
    source: https://googlecode.blogspot.com/2011/10/dart-language-for-structured-web.html
  - year: 2015
    what: "Google drops the plan to put the Dart VM in Chrome and focuses on compiling Dart to JavaScript"
    source: https://news.dartlang.org/2015/03/dart-for-entire-web.html
  - year: 2018
    what: "Flutter 1.0 ships in December, alongside Dart 2.1"
    source: https://www.infoq.com/news/2018/12/flutter-1.0-released
  - year: 2023
    what: "Dart 3 makes null safety fully sound and adds records, patterns and class modifiers"
    source: https://dart.cn/blog/announcing-dart-3
links:
  website: https://dart.dev
  repo: https://github.com/dart-lang/sdk
pldb: dart
sources:
  - https://googlecode.blogspot.com/2011/10/dart-language-for-structured-web.html
  - https://news.dartlang.org/2015/03/dart-for-entire-web.html
  - https://www.infoq.com/news/2018/12/flutter-1.0-released
  - https://dart.cn/blog/announcing-dart-3
  - https://flutter.dev/showcase
  - https://pldb.io/concepts/dart.html
verified: false
last_reviewed: "2026-10-30"
