id: swift
name: Swift
appeared: 2014
creators: [Chris Lattner]
org: Apple
type: mobile
status: alive
tagline: Programming language for building apps on Apple platforms such as iOS and macOS.
born_from: >-
  Chris Lattner started Swift at Apple in July 2010. Objective-C sat on top of C, with C's pointers and unchecked memory, and Lattner later said that memory safety could not be added to Objective-C without removing the C underneath, which would no longer be Objective-C.
reacts_to: [objective-c, rust, haskell, ruby, python, csharp]
tradeoffs:
  memory: refcount
  types: static
  run: native
  concurrency: [async, actors]
  cost: "Tooling and libraries are strongest on Apple platforms, reference counting needs weak references to break cycles by hand, and the binary interface was only declared stable in 2019."
slots:
  - slot: mobile
    fit: strong
  - slot: server
    fit: ok
    note: "Vapor is a Swift framework for HTTP servers, backends and APIs, built on Apple's SwiftNIO."
  - slot: cli
    fit: ok
  - slot: scripts
    fit: ok
    note: "A Swift file runs as a script with the swift command; outside a Mac the Swift toolchain has to be installed first."
  - slot: config
    fit: ok
    note: "Swift packages describe their build in Package.swift, a Swift file."
  - slot: games
    fit: ok
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Browsers run only JavaScript and WebAssembly. Swift gets in through the Swift SDK for WebAssembly, which is still young."
    source: https://www.swift.org/documentation/articles/wasm-getting-started.html
  - slot: database
    fit: weak
    reason: runs-elsewhere
    note: "Databases are asked in SQL; Swift apps reach SQLite through toolkits such as GRDB."
    source: https://github.com/groue/GRDB.swift
  - slot: systems
    fit: weak
    reason: hides-machine
    note: "Swift manages memory automatically, so programmers do not free it by hand."
    source: https://www.swift.org/about/
  - slot: compute
    fit: weak
    reason: runs-elsewhere
    note: "Swift drives Apple GPUs through Metal, but the GPU code itself is written in Metal's own shading language and runs only on Apple devices."
    source: https://developer.apple.com/metal/
  - slot: embedded
    fit: weak
    reason: no-tools
    note: "Embedded Swift is a reduced Swift for microcontrollers and still young next to C, which chip makers' tools are built for."
    source: https://www.swift.org/blog/embedded-swift-examples/
  - slot: wasm
    fit: weak
    reason: no-tools
    note: "Swift SDKs for Wasm cross-compile Swift to WebAssembly, though the work started as a community project."
    source: https://www.swift.org/documentation/articles/wasm-getting-started.html
  - slot: data
    fit: none
    reason: no-tools
    note: "Google archived Swift for TensorFlow in 2021, and data and machine learning tools are built for Python."
    source: https://github.com/tensorflow/swift
won_where:
  - what: "Apple's platforms, for which Apple describes Swift as its language"
    source: "https://developer.apple.com/swift/"
  - what: "SwiftUI, Apple's framework for app interfaces on its platforms, available from iOS 13 and macOS 10.15"
    source: "https://developer.apple.com/documentation/swiftui.md"
alternatives: [objective-c, kotlin, dart, typescript]
timeline:
  - year: 2010
    what: "Chris Lattner starts Swift at Apple in July 2010"
    source: "https://nondot.org/sabre/"
  - year: 2014
    what: "Apple announces Swift at WWDC 2014 as a beta for iOS 8 and OS X Yosemite"
    source: "https://www.infoq.com/news/2014/06/apple-swift"
  - year: 2015
    what: "Apple releases Swift as open source under Apache 2.0, with Linux support"
    source: "https://www.apple.com/nz/newsroom/2015/12/03Apple-Releases-Swift-as-Open-Source/"
  - year: 2019
    what: "Swift 5 is declared ABI stable on Apple platforms"
    source: "https://swift.org/blog/abi-stability-and-more/"
links:
  website: https://www.swift.org/
pldb: swift
