id: rust
name: Rust
appeared: 2010
creators: [Graydon Hoare]
org: Rust Foundation
type: systems
status: alive
tagline: Memory-safe systems programming without a garbage collector.
born_from: >-
  Graydon Hoare started Rust as a personal project in 2006 after yet another memory-safety crash,
  this time in the elevator software of his apartment building. Mozilla picked it up in 2009
  because Firefox was written in C++ and memory bugs in C++ were the main source of its security
  holes, while garbage-collected languages were too slow for a browser engine.
reacts_to: [cpp, cyclone, ocaml, haskell, erlang]
tradeoffs:
  memory: ownership
  types: static
  run: native
  concurrency: [threads, async]
  cost: Slow compiles and a learning curve measured in weeks, because the borrow checker refuses programs that other languages accept.
slots:
  - slot: server
    fit: strong
    note: "Cloudflare's Pingora proxy, which serves over a trillion requests a day, is written in Rust."
  - slot: systems
    fit: strong
    note: "The Linux kernel accepts Rust since version 6.1, next to C."
  - slot: cli
    fit: strong
    note: "Many fast command-line tools, such as ripgrep, are written in Rust."
  - slot: embedded
    fit: strong
    note: "Rust runs on small chips with no garbage collector."
  - slot: wasm
    fit: strong
    note: "Wasmtime, a WebAssembly runtime, is written in Rust."
  - slot: database
    fit: ok
    note: "TiKV, a distributed key-value store, is written in Rust."
  - slot: data
    fit: ok
    note: "Polars, a fast data-frame library, is written in Rust and used from Python."
  - slot: compute
    fit: ok
    note: "Candle, Hugging Face's machine learning library, is written in Rust."
  - slot: games
    fit: ok
    note: "Bevy is a Rust game engine; big commercial studios still mostly ship C++."
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Browsers run only JavaScript and WebAssembly. Rust gets into a web page by being compiled to WebAssembly, with JavaScript glue around it."
    source: https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Rust_to_Wasm
  - slot: mobile
    fit: weak
    reason: no-tools
    note: "Android's app tools are built for Kotlin and Java; Rust is not one of their languages."
    source: https://developer.android.com/kotlin/first
  - slot: scripts
    fit: weak
    reason: overkill
    note: "Rust programs are compiled ahead of time with rustc, so a quick task needs a build step first."
    source: https://doc.rust-lang.org/book/ch01-02-hello-world.html
  - slot: config
    fit: none
    reason: no-tools
    note: "Rust projects keep their own settings in Cargo.toml, a data file, and cloud setup tools such as Pulumi do not take Rust."
    source: https://www.pulumi.com/docs/iac/languages-sdks/
won_where:
  - what: "Linux kernel accepted Rust as a second language in 6.1"
    source: "https://lwn.net/Articles/910762/"
  - what: "Android, where new native code in Rust cut memory-safety bugs"
    source: "https://security.googleblog.com/2022/12/memory-safe-languages-in-android-13.html"
  - what: "Firefox Quantum shipped the Stylo CSS engine written in Rust"
    source: "https://hacks.mozilla.org/2017/11/entering-the-quantum-era-how-firefox-got-fast-again-and-where-its-going-to-get-faster/"
  - what: "AWS Firecracker, the microVM behind Lambda and Fargate"
    source: "https://aws.amazon.com/blogs/aws/firecracker-lightweight-virtualization-for-serverless-computing/"
  - what: "Cloudflare replaced NGINX with Pingora, serving over a trillion requests a day"
    source: "https://blog.cloudflare.com/how-we-built-pingora-the-proxy-that-connects-cloudflare-to-the-internet/"
alternatives: [zig, cpp, go, c]
timeline:
  - year: 2006
    what: "Graydon Hoare begins Rust as a side project"
    source: "https://www.technologyreview.com/2023/02/14/1067869/rust-worlds-fastest-growing-programming-language/"
  - year: 2009
    what: "Mozilla starts sponsoring the project"
    source: "https://www.technologyreview.com/2023/02/14/1067869/rust-worlds-fastest-growing-programming-language/"
  - year: 2010
    what: "Rust announced publicly at the Mozilla Annual Summit"
    source: "https://venge.net/graydon/talks/intro-talk-2.pdf"
  - year: 2015
    what: "Rust 1.0 with the stability promise"
    source: "https://blog.rust-lang.org/2015/05/15/Rust-1.0.html"
  - year: 2017
    what: "Firefox 57 ships Stylo, the first large Rust component in a mass-market product"
    source: "https://hacks.mozilla.org/2017/11/entering-the-quantum-era-how-firefox-got-fast-again-and-where-its-going-to-get-faster/"
  - year: 2021
    what: "Rust Foundation founded by AWS, Google, Huawei, Microsoft and Mozilla"
    source: "https://foundation.rust-lang.org/news/2021-02-08-hello-world/"
  - year: 2022
