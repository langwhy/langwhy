id: bash
name: Bash
appeared: 1989
creators:
  - Brian Fox
org: "GNU Project, maintained by Chet Ramey"
type: shell
status: stable
tagline: "Command language and shell of the GNU Project, for running programs and writing scripts."
born_from: >-
  In 1989 Brian Fox, an employee of the Free Software Foundation, began Bash as a free alternative to the Bourne shell for the GNU Project. The Bourne shell, sh, came from Steve Bourne at Bell Labs, and Bash was meant to stay compatible with it while adding the interactive features of the Korn shell (ksh) and the C shell (csh).
reacts_to: [sh, ksh]
tradeoffs:
  memory: n/a
  types: n/a
  run: interpreted
  concurrency: [none]
  cost: "It keeps the Bourne shell's quirks, quoting and grammar included, so old sh scripts still run and new ones inherit the dark corners."
slots:
  - slot: cli
    fit: strong
    note: "Built for interactive use: job control, command-line editing and history."
  - slot: scripts
    fit: strong
  - slot: config
    fit: ok
    note: "Bash reads ~/.bashrc, a Bash script, when an interactive shell starts."
  - slot: server
    fit: weak
    reason: one-job
    note: "Google's shell style guide limits shell to small utilities and simple wrapper scripts, so backend code belongs in another language."
    source: https://google.github.io/styleguide/shellguide.html
  - slot: data
    fit: weak
    reason: one-job
    note: "Bash does arithmetic only on whole numbers, so averages and statistics need awk or another tool."
    source: https://man7.org/linux/man-pages/man1/bash.1.html
  - slot: browser
    fit: none
    reason: runs-elsewhere
    note: "Browsers run JavaScript and WebAssembly, so a Bash script cannot run inside a web page."
    source: https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts
  - slot: database
    fit: none
    reason: runs-elsewhere
    note: "Databases such as PostgreSQL take SQL, so a Bash script can only reach one by calling a client program such as psql."
    source: https://www.postgresql.org/docs/current/app-psql.html
  - slot: systems
    fit: none
    reason: one-job
    note: "Bash is a command language interpreter that runs other programs and connects them with pipes; kernels and drivers need code that controls memory directly."
    source: https://man7.org/linux/man-pages/man1/bash.1.html
  - slot: mobile
    fit: none
    reason: runs-elsewhere
    note: "Android apps are built with Kotlin or Java, using the tools Google provides for them."
    source: https://developer.android.com/kotlin/first
  - slot: compute
    fit: none
    reason: too-slow
    note: "Bash is an interpreter that does math only on whole numbers, so GPU and simulation code needs native, fast code."
    source: https://man7.org/linux/man-pages/man1/bash.1.html
  - slot: embedded
    fit: none
    reason: too-slow
    note: "Bash runs each step of a pipeline as a separate process, too much for a device with kilobytes of memory."
    source: https://man7.org/linux/man-pages/man1/bash.1.html
  - slot: wasm
    fit: none
    reason: runs-elsewhere
    note: "WebAssembly is a compilation target for languages such as C, C++ and Rust; Bash runs commands as it reads them."
    source: https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts
  - slot: games
    fit: none
    reason: too-slow
    note: "Each step of a Bash pipeline runs as a separate process, too costly to redraw a game 60 times a second."
    source: https://man7.org/linux/man-pages/man1/bash.1.html
won_where:
  - what: "GitHub Actions runs run: steps in bash on Linux and macOS runners by default"
    source: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
  - what: "GitLab Runner uses Sh/Bash as the default shell on Unix, with sh as the fallback"
    source: https://docs.gitlab.com/runner/shells/
alternatives: [python, perl, ruby, awk]
timeline:
  - year: 1989
    what: "Brian Fox begins Bash for the GNU Project as a free alternative to the Bourne shell"
    source: https://pldb.io/concepts/bash.html
  - year: 1996
    what: "Bash 2.0 tarball is published on the GNU FTP server"
    source: https://ftp.gnu.org/gnu/bash/
  - year: 2009
    what: "Chet Ramey announces the first public release of bash-4.0 on the info-gnu list"
    source: https://lists.gnu.org/r/info-gnu/2009-02/msg00018.html
  - year: 2014
    what: "Shellshock, CVE-2014-6271, lets crafted environment variables run commands in Bash through 4.3"
    source: https://ubuntu.com/security/CVE-2014-6271
  - year: 2019
    what: "Bash 5.0 tarball is published on the GNU FTP server"
    source: https://ftp.gnu.org/gnu/bash/
  - year: 2019
    what: "Apple announces zsh as the default shell in macOS 10.15 Catalina"
    source: https://www.scriptingosx.com/2019/06/moving-to-zsh/
links:
