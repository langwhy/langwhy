id: python
name: Python
appeared: 1991
creators: [Guido van Rossum]
type: scripting
status: alive
tagline: "General-purpose language for scripts, automation, web backends and data analysis."
born_from: >-
  In December 1989 Guido van Rossum, a programmer on the Amoeba distributed operating system at CWI, started a hobby project to fill the week around Christmas. Amoeba needed a scripting language, and he wanted an interpreted language for writing and testing its administration scripts. He drew on ABC, a language he had worked on that was intended for non-technical users.
reacts_to: [abc, c, modula-3]
tradeoffs:
  memory: refcount
  types: dynamic
  run: interpreted
  concurrency: [threads, async]
  cost: "The global interpreter lock stops threads from running Python code at the same time, so CPU-heavy work needs processes or C extensions."
slots:
  - slot: server
    fit: strong
    note: "Django and Flask are the common web frameworks."
  - slot: scripts
    fit: strong
    note: "Short to write and ready on most Linux and macOS machines, so it is a usual pick for automation."
  - slot: data
    fit: strong
    note: "NumPy, pandas and Jupyter are the everyday tools of data analysis."
  - slot: cli
    fit: ok
    note: "Fine for tools you run yourself; whoever runs them needs Python installed too."
  - slot: compute
    fit: ok
    note: "PyTorch and NumPy hand the heavy math to code written in C, C++ and CUDA; Python steers it."
  - slot: config
    fit: ok
    note: "AWS CDK and Pulumi describe cloud servers in Python code; plain settings files use TOML or YAML instead."
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Browsers run only JavaScript and WebAssembly. Python gets in only by shipping a whole interpreter compiled to WebAssembly, as Pyodide does."
    source: https://pyodide.org/en/stable/
  - slot: database
    fit: weak
    reason: runs-elsewhere
    note: "Databases are asked in SQL. PostgreSQL can run Python functions inside it, but the queries stay SQL."
    source: https://www.postgresql.org/docs/current/plpython.html
  - slot: mobile
    fit: weak
    reason: no-tools
    note: "Android's own tools are built for Kotlin and Java; Python apps need third-party kits such as Kivy."
    source: https://developer.android.com/kotlin/first
  - slot: embedded
    fit: weak
    reason: too-slow
    note: "MicroPython runs a subset of Python on microcontrollers; time-critical parts still drop to native code."
    source: https://docs.micropython.org/en/latest/reference/speed_python.html
  - slot: wasm
    fit: weak
    reason: too-slow
    note: "Python reaches WebAssembly only by bringing its whole interpreter along, as Pyodide does."
    source: https://pyodide.org/en/stable/
  - slot: games
    fit: weak
    reason: too-slow
    note: "Pygame is enough for small 2D games, but an interpreter makes it hard to draw a large game 60 times a second."
    source: https://www.pygame.org/docs/
  - slot: systems
    fit: none
    reason: hides-machine
    note: "Python needs its interpreter underneath, and that interpreter is itself written in C."
    source: https://github.com/python/cpython
won_where:
  - what: "Dropbox published how it moved over one million lines of Python from Python 2 to Python 3 (2019)"
    source: https://dropbox.tech/application/incrementally-migrating-over-one-million-lines-of-code-from-python-2-to-python-3
  - what: "NumPy, the fundamental package for scientific computing with Python"
    source: https://numpy.org/
alternatives: [javascript, go, r]
timeline:
  - year: 1989
    what: "Guido van Rossum starts Python as a hobby project in the week around Christmas"
    source: https://www.python.org/doc/essays/foreword/
  - year: 1991
    what: "Python 0.9.0 is released to the alt.sources newsgroup in February"
    source: https://python-history.blogspot.com/2009/01/brief-timeline-of-python.html
  - year: 2000
    what: "Python 2.0 is released on October 16"
    source: https://python-history.blogspot.com/2009/01/brief-timeline-of-python.html
  - year: 2008
    what: "Python 3.0 is released on December 3"
    source: https://python-history.blogspot.com/2009/01/brief-timeline-of-python.html
  - year: 2020
    what: "Python 2 reaches end of life on January 1"
    source: https://www.python.org/doc/sunset-python-2/
  - year: 2023
    what: "PEP 703, Making the Global Interpreter Lock Optional in CPython, is accepted"
    source: https://peps.python.org/pep-0703/
