id: csharp
name: C#
appeared: 2000
creators: [Anders Hejlsberg]
org: Microsoft
type: backend
status: alive
tagline: "Language for building .NET applications, from web services and desktop apps to Unity game scripts."
born_from: >-
  In January 1999 Anders Hejlsberg, who had designed Turbo Pascal and Delphi and worked on Visual
  J++, formed a team at Microsoft to build a new language for the .NET runtime, first called COOL.
  Microsoft's own Java had been tied up in a lawsuit with Sun since the late 1990s, and the January
  2001 settlement ended the 1996 Java licence, so .NET needed a managed language of its own. The
  language was announced as C# in July 2000.
reacts_to: [java, delphi]
tradeoffs:
  memory: gc
  types: static
  run: vm
  concurrency: [threads, async]
  cost: "The .NET runtime is large and garbage-collected, so latency-sensitive code needs tuning that C or Rust code avoids."
slots:
  - slot: server
    fit: strong
    note: "Stack Overflow's 2016 web tier ran on ASP.NET MVC."
  - slot: games
    fit: strong
    note: "Unity uses C# for gameplay scripts."
  - slot: database
    fit: ok
  - slot: cli
    fit: ok
  - slot: config
    fit: ok
    note: "Pulumi and AWS CDK describe cloud servers in C# code."
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Browsers run JavaScript and WebAssembly; Blazor runs C# there on a WebAssembly-based .NET runtime."
    source: https://learn.microsoft.com/en-us/aspnet/core/blazor/hosting-models
  - slot: systems
    fit: weak
    reason: hides-machine
    note: "The .NET garbage collector decides the best time to free memory, and developers do not release it by hand."
    source: https://learn.microsoft.com/en-us/dotnet/standard/garbage-collection/fundamentals
  - slot: mobile
    fit: weak
    reason: no-tools
    note: "C# phone apps go through .NET MAUI, Microsoft's framework for Android, iOS, macOS and Windows."
    source: https://learn.microsoft.com/en-us/dotnet/maui/what-is-maui
  - slot: scripts
    fit: weak
    reason: overkill
    note: "Since .NET 10 one C# file can run on its own, but the .NET SDK has to be installed and builds it first, a step Bash or Python skip."
    source: https://learn.microsoft.com/en-us/dotnet/core/sdk/file-based-apps
  - slot: data
    fit: weak
    reason: no-tools
    note: "NumPy, the fundamental package for scientific computing, is built for Python."
    source: https://numpy.org/
  - slot: compute
    fit: weak
    reason: no-tools
    note: "TorchSharp gives C# the engine behind PyTorch, but most GPU and AI code and examples are in Python and C++."
    source: https://github.com/dotnet/TorchSharp
  - slot: embedded
    fit: weak
    reason: too-slow
    note: "nanoFramework runs C# on chips such as the ESP32 through a small .NET runtime that has to fit on the chip next to the program."
    source: https://nanoframework.net/
  - slot: wasm
    fit: weak
    reason: too-slow
    note: "Blazor downloads the .NET runtime to the browser with the app, so the first load is larger."
    source: https://learn.microsoft.com/en-us/aspnet/core/blazor/hosting-models
won_where:
  - what: "Unity, where gameplay scripts are written in C#"
    source: https://docs.unity.com/en-us/engine/6000.3/manual/scripting/get-started/intro-to
  - what: "Stack Overflow, whose 2016 web tier ran on ASP.NET MVC 5.2.3 and .NET 4.6.1"
    source: https://netlify.nickcraver.com/blog/2016/02/17/stack-overflow-the-architecture-2016-edition/
alternatives: [java, kotlin, go, dart]
timeline:
  - year: 1999
    what: "Hejlsberg forms a team in January to build the language, then called COOL"
    source: "https://en.wikipedia.org/wiki/C_Sharp_(programming_language)"
  - year: 2000
    what: "Microsoft's July 2000 Orlando release promotes C# as one of the .NET languages"
    source: https://news.microsoft.com/source/2000/07/11/microsoft-announces-groundswell-of-support-for-net-platform
  - year: 2001
    what: "Settlement with Sun ends the 1996 Java license that Microsoft had used"
    source: https://www.infoworld.com/article/2159673/sun-microsoft-settle-java-lawsuit.html
  - year: 2002
    what: "C# is standardized as ECMA-334, 2nd edition, in December 2002"
    source: https://ecma-international.org/publications-and-standards/standards/ecma-334/
  - year: 2014
    what: "Microsoft announces that .NET Core will be open source, including the runtime"
    source: https://devblogs.microsoft.com/dotnet/net-core-is-open-source
  - year: 2023
    what: "ECMA-334 7th edition, the latest C# specification, is published in December"
    source: https://ecma-international.org/publications-and-standards/standards/ecma-334/
links:
