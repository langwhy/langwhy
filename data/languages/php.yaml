id: php
name: PHP
appeared: 1995
creators: [Rasmus Lerdorf, Zeev Suraski, Andi Gutmans]
type: web
status: alive
tagline: "Server-side scripting language for web pages and web applications."
born_from: >-
  In 1994 Rasmus Lerdorf wrote a set of small CGI programs in C to track visits to his online résumé. He called the collection Personal Home Page Tools and released its source publicly in June 1995. In 1997 Zeev Suraski and Andi Gutmans began rewriting its parser for an e-commerce application they were building for a university project, and PHP 3.0 was announced in June 1998.
reacts_to: [c]
tradeoffs:
  memory: refcount
  types: dynamic
  run: interpreted
  concurrency: [none]
  cost: "Each request starts a script from scratch, so state that must survive between pages has to live in a database or cache."
slots:
  - slot: server
    fit: strong
    note: "WordPress and MediaWiki run on it."
  - slot: cli
    fit: ok
    note: "Composer, the PHP package manager, is a command-line tool written in PHP."
  - slot: scripts
    fit: ok
    note: "Runs from the command line with the php binary."
  - slot: config
    fit: ok
    note: "WordPress's wp-config.php and Laravel's config files are PHP code."
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "PHP runs on the web server and sends finished HTML to the browser. Running PHP in the page needs PHP compiled to WebAssembly, as WordPress Playground does."
    source: https://github.com/WordPress/wordpress-playground
  - slot: database
    fit: weak
    reason: runs-elsewhere
    note: "Databases such as PostgreSQL are queried in SQL, not PHP."
    source: https://www.postgresql.org/docs/current/sql.html
  - slot: data
    fit: weak
    reason: no-tools
    note: "NumPy, the fundamental package for scientific computing, is built for Python, not PHP."
    source: https://numpy.org/
  - slot: wasm
    fit: weak
    reason: too-slow
    note: "WordPress Playground runs WordPress in the browser with PHP built for WebAssembly."
    source: https://github.com/WordPress/wordpress-playground
  - slot: systems
    fit: none
    reason: hides-machine
    note: "PHP scripts need the PHP parser to run, a program that sits between the script and the hardware."
    source: https://www.php.net/manual/en/introduction.php
  - slot: mobile
    fit: none
    reason: no-tools
    note: "Android's own tools are built for Kotlin and Java, not PHP."
    source: https://developer.android.com/kotlin/first
  - slot: compute
    fit: none
    reason: no-tools
    note: "NumPy, the fundamental package for scientific computing, is built for Python, not PHP."
    source: https://numpy.org/
  - slot: embedded
    fit: none
    reason: runs-elsewhere
    note: "PHP needs its parser installed, plus a web server or the command line, to run any script."
    source: https://www.php.net/manual/en/introduction.php
  - slot: games
    fit: none
    reason: no-tools
    note: "Unity, a common game engine, uses C# code for its game scripts, not PHP."
    source: https://docs.unity.com/en-us/engine/current/manual/scripting/get-started/creating-scripts
won_where:
  - what: "WordPress runs on 39.5 % of all websites (W3Techs, 30 October 2026)"
    source: https://w3techs.com/technologies/details/cm-wordpress
  - what: "PHP is used by 69.2 % of websites with a known server-side language"
    source: https://w3techs.com/technologies/details/pl-php
  - what: "MediaWiki, the software Wikipedia runs on, requires PHP 8.3.0 for its latest stable release"
    source: https://www.mediawiki.org/wiki/Manual:Installation_requirements
  - what: "Facebook's Hack, a gradually typed language for HHVM that works with PHP (2014)"
    source: https://engineering.fb.com/2014/04/10/developer-tools/hack-developer-day-recap
alternatives: [python, ruby, javascript]
timeline:
  - year: 1994
    what: "Rasmus Lerdorf writes CGI programs in C to track visits to his online résumé"
    source: https://www.php.net/manual/en/history.php.php
  - year: 1995
    what: "Personal Home Page Tools is released to the public in June"
    source: https://www.php.net/manual/en/history.php.php
  - year: 1998
    what: "PHP 3.0 is announced in June as the successor to PHP/FI 2.0"
    source: https://www.php.net/manual/en/history.php.php
  - year: 2015
    what: "PHP 7.0 is released, up to twice as fast as PHP 5.6"
    source: https://www.php.net/manual/en/history.php.php
  - year: 2020
    what: "PHP 8.0 is released with a JIT compiler and union types"
    source: https://www.php.net/manual/en/history.php.php
links:
