id: haskell
name: Haskell
appeared: 1990
creators:
  - Haskell Committee
  - Paul Hudak
  - Philip Wadler
org: haskell.org community
type: functional
status: alive
tagline: "Purely functional, lazily evaluated language for writing programs as typed functions."
born_from: >-
  In September 1987 a meeting at the FPCA conference in Portland, Oregon, faced more than a dozen non-strict, purely functional languages with similar power and agreed that a committee should design one common language. The most mature of them, Miranda, was a commercial product of David Turner's company, and Turner declined to let the committee adopt it as the starting point.
reacts_to: [miranda, ml]
tradeoffs:
  memory: gc
  types: static
  run: native
  concurrency: [green]
  cost: "Laziness makes space use hard to predict, and even experienced programmers struggle with it, so the language later gained strict features."
slots:
  - slot: server
    fit: ok
    note: "Facebook's Sigma rule engine was rewritten in Haskell and serves more than one million requests per second."
  - slot: cli
    fit: ok
    note: "Pandoc is a Haskell library and a command-line tool for converting document formats."
  - slot: config
    fit: ok
    note: "xmonad, a tiling window manager, is written and configured in Haskell."
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Browsers run JavaScript and WebAssembly; GHC's JavaScript backend is still a technical preview, not for production."
    source: https://downloads.haskell.org/ghc/latest/docs/users_guide/codegens.html
  - slot: database
    fit: weak
    reason: runs-elsewhere
    note: "Databases such as PostgreSQL are queried in SQL, so Haskell code reaches them through a separate client library."
    source: https://www.postgresql.org/docs/current/app-psql.html
  - slot: scripts
    fit: weak
    reason: overkill
    note: "runghc runs a Haskell file without a separate compile step, but GHC itself has to be installed first."
    source: https://downloads.haskell.org/ghc/latest/docs/users_guide/runghc.html
  - slot: data
    fit: weak
    reason: no-tools
    note: "Hasktorch brings tensors and neural networks to Haskell by reusing the C++ core that PyTorch uses."
    source: https://github.com/hasktorch/hasktorch
  - slot: compute
    fit: weak
    reason: no-tools
    note: "Accelerate runs Haskell array code on GPUs, a separate path from the C++ and Python tools most GPU work uses."
    source: https://www.acceleratehs.org/
  - slot: wasm
    fit: weak
    reason: no-tools
    note: "Haskell reaches WebAssembly only through a special build of the GHC compiler, not the one most people install."
    source: https://downloads.haskell.org/ghc/latest/docs/users_guide/wasm.html
  - slot: games
    fit: weak
    reason: hides-machine
    note: "GHC uses a stop-the-world garbage collector, and its long pauses during major collections can cost a game its frame time."
    source: https://downloads.haskell.org/ghc/latest/docs/users_guide/runtime_control.html
  - slot: systems
    fit: none
    reason: hides-machine
    note: "GHC uses a stop-the-world copying garbage collector that frees memory on its own schedule, not the programmer's."
    source: https://downloads.haskell.org/ghc/latest/docs/users_guide/runtime_control.html
  - slot: mobile
    fit: none
    reason: no-tools
    note: "Android apps are built with Kotlin or Java, using the tools Google provides for them."
    source: https://developer.android.com/kotlin/first
  - slot: embedded
    fit: none
    reason: hides-machine
    note: "GHC programs run a garbage collector that decides when memory is freed, a runtime that microcontrollers with kilobytes of memory cannot carry."
    source: https://downloads.haskell.org/ghc/latest/docs/users_guide/runtime_control.html
won_where:
  - what: "Facebook Sigma, an anti-abuse rule engine rewritten in Haskell, serving over one million requests per second"
    source: https://engineering.fb.com/2015/06/26/security/fighting-spam-with-haskell/
  - what: "xmonad, a dynamically tiling X11 window manager written and configured in Haskell"
    source: https://xmonad.org/
  - what: "Cardano, whose platform is written in Haskell"
    source: https://docs.cardano.org/about-cardano/introduction
  - what: "Pandoc, a document converter that is a Haskell library and a command-line tool"
    source: https://github.com/jgm/pandoc
alternatives: [ocaml, scala, fsharp, rust]
timeline:
  - year: 1987
    what: "A meeting at FPCA in Portland, Oregon, decides that a committee should design one common language"
    source: https://www.microsoft.com/en-us/research/wp-content/uploads/2016/07/history.pdf
  - year: 1990
    what: "Haskell 1.0 report, dated 1 April 1990"
    source: https://www.microsoft.com/en-us/research/wp-content/uploads/2016/07/history.pdf
  - year: 1999
    what: "Haskell 98 report published, a commitment to a stable language"
    source: https://www.microsoft.com/en-us/research/wp-content/uploads/2016/07/history.pdf
  - year: 2007
    what: "A History of Haskell is presented at HOPL III in San Diego"
    source: https://www.microsoft.com/en-us/research/wp-content/uploads/2016/07/history.pdf
  - year: 2010
    what: "Haskell 2010 Language Report is published"
    source: https://www.haskell.org/onlinereport/haskell2010/
  - year: 2015
    what: "Facebook rewrites Sigma in Haskell, replacing its in-house FXL language"
    source: https://engineering.fb.com/2015/06/26/security/fighting-spam-with-haskell/
