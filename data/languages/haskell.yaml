  - year: 1999
    what: "Haskell 98 report published, a commitment to a stable language"
    source: https://www.microsoft.com/en-us/research/wp-content/uploads/2016/07/history.pdf
  - year: 2007
    what: "A History of Haskell is presented at HOPL III in San Diego"
