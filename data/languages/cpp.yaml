id: cpp
name: C++
appeared: 1985
creators: [Bjarne Stroustrup]
type: systems
status: alive
tagline: "Compiled language that adds classes, templates and manual memory control to C."
born_from: >-
  In 1979 Bjarne Stroustrup was using Simula, which had the classes he wanted, to simulate a distributed operating system. Simula ran too slowly for the job, so he set out to combine its classes with the speed of C, and the first version was called C with Classes.
reacts_to: [c, simula]
tradeoffs:
  memory: manual
  types: static
  run: native
  concurrency: [threads]
  cost: "A large language that keeps C's undefined behaviour and offers many ways to misuse the same feature, and template-heavy code gives long compile times and error messages."
slots:
  - slot: systems
    fit: strong
    note: "The LLVM and Clang compiler tools are written in C++."
  - slot: compute
    fit: strong
    note: "CUDA GPU programs are written in C++, the language NVIDIA's CUDA guide teaches."
  - slot: games
    fit: strong
    note: "Unreal Engine's gameplay classes are written in C++."
  - slot: server
    fit: ok
    note: "Envoy, a network proxy used in service meshes, is written in C++."
  - slot: database
    fit: ok
    note: "ClickHouse and MongoDB are database servers written in C++."
  - slot: cli
    fit: ok
    note: "The Clang compiler is a command-line program written in C++."
  - slot: embedded
    fit: ok
    note: "Arduino sketches are written in C++, which runs on many small boards."
  - slot: wasm
    fit: ok
    note: "Emscripten compiles C++ to WebAssembly."
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Browsers run only JavaScript and WebAssembly. C++ gets into a web page by being compiled to WebAssembly, and JavaScript still loads it."
    source: https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts
  - slot: mobile
    fit: weak
    reason: no-tools
    note: "Android apps use C++ code through the NDK, a separate native kit that Java code calls into."
    source: https://developer.android.com/ndk/guides
  - slot: scripts
    fit: weak
    reason: overkill
    note: "C++ programs are compiled and linked into an executable before they run, so a quick task needs a build step first."
    source: https://gcc.gnu.org/onlinedocs/gcc/Overall-Options.html
  - slot: data
    fit: weak
    reason: overkill
    note: "Data work means trying one small step after another; C++ needs a compile for every change. Analysts use Python, whose NumPy is C underneath."
    source: https://numpy.org/
  - slot: config
    fit: none
    reason: no-tools
    note: "Settings files are plain data, and cloud setup tools such as Pulumi take TypeScript, Python, Go, Java or C#, not C++."
    source: https://www.pulumi.com/docs/iac/languages-sdks/
won_where:
  - what: "V8, the JavaScript engine used in Chrome and Node.js, is written in C++"
    source: "https://v8.dev/docs"
  - what: "LLVM, the compiler framework, is written in the subset of C++ its coding standards define"
    source: "https://llvm.org/docs/GettingStarted.html"
alternatives: [rust, c, zig]
timeline:
  - year: 1979
    what: "Work on C with Classes begins, the first version of C++"
    source: "https://softwarepreservation.computerhistory.org/c_plus_plus/"
  - year: 1984
    what: "The name C++ is adopted"
    source: "https://softwarepreservation.computerhistory.org/c_plus_plus/"
  - year: 1985
    what: "Cfront 1.0, the first commercial release of C++"
    source: "https://softwarepreservation.computerhistory.org/c_plus_plus/"
  - year: 1998
    what: "ISO/IEC 14882:1998, the first ISO C++ standard, is published on 1 September 1998"
    source: "https://www.stroustrup.com/iso_pressrelease2.html"
  - year: 2023
    what: "Technical work on C++23 is completed; the standard is published as ISO/IEC 14882:2024"
    source: "https://isocpp.org/std/the-standard"
links:
  website: https://isocpp.org/
pldb: cpp
sources:
  - https://www.stroustrup.com/bs_faq.html
  - https://stroustrup.com/gillies.htm
  - https://softwarepreservation.computerhistory.org/c_plus_plus/
  - https://www.stroustrup.com/iso_pressrelease2.html
  - https://isocpp.org/std/the-standard
  - https://v8.dev/docs
  - https://llvm.org/docs/GettingStarted.html
  - https://pldb.io/concepts/cpp.html
verified: false
last_reviewed: "2026-10-30"
