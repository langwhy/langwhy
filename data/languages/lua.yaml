id: lua
name: Lua
appeared: 1994
creators:
  - Roberto Ierusalimschy
  - Luiz Henrique de Figueiredo
  - Waldemar Celes
org: "PUC-Rio, Rio de Janeiro"
type: scripting
status: alive
tagline: "Embeddable scripting language for adding logic and configuration to a host program."
born_from: >-
  In 1992 Petrobras, the Brazilian oil company, asked Tecgraf, the graphics lab at PUC-Rio, for data-entry front-ends for its engineers, and by 1993 Tecgraf had two small languages, DEL and SOL, for the job. DEL grew heavier each time users asked for conditionals and loops, and Brazil's market reserve, in force from 1977 to 1992, made buying customized software from abroad hard, so Tecgraf built its own tools and merged the two into one embeddable language.
reacts_to: [scheme, modula]
tradeoffs:
  memory: gc
  types: dynamic
  run: vm
  concurrency: [green]
  cost: "Small by design: the official distribution ships few libraries, so the host program supplies most tools, and until Lua 5.0 the garbage collector could pause the program for long stretches."
slots:
  - slot: config
    fit: strong
    note: "Neovim reads its configuration from init.lua."
  - slot: games
    fit: strong
    note: "Roblox scripts are written in Luau, a dialect of Lua."
  - slot: server
    fit: ok
    note: "OpenResty integrates LuaJIT, a Lua engine, into the nginx web server."
  - slot: database
    fit: ok
    note: "Redis runs Lua scripts inside the database server and executes each script atomically."
  - slot: embedded
    fit: ok
    note: "NodeMCU is Lua-based firmware for ESP8266 and ESP32 Wi-Fi chips."
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Browsers run JavaScript and WebAssembly, so Lua reaches a page only through a Lua engine written in JavaScript, such as Fengari."
    source: https://github.com/fengari-lua/fengari
  - slot: mobile
    fit: weak
    reason: no-tools
    note: "Phone apps in Lua use Solar2D, a Lua engine that also targets iOS and Android."
    source: https://solar2d.com/
  - slot: cli
    fit: weak
    reason: no-tools
    note: "LuaRocks is the package manager for Lua modules; a Lua program still needs a Lua interpreter on the user's machine."
    source: https://luarocks.org/
  - slot: scripts
    fit: weak
    reason: one-job
    note: "Lua is made to live inside other programs, so its own library is small: even listing a folder needs an add-on such as LuaFileSystem."
    source: https://lunarmodules.github.io/luafilesystem/
  - slot: data
    fit: weak
    reason: no-tools
    note: "Lua's standard library covers strings, tables, math and files; statistics and data frames come from add-on libraries."
    source: https://www.lua.org/manual/5.4/manual.html
  - slot: compute
    fit: weak
    reason: no-tools
    note: "LuaJIT is among the fastest dynamic language engines, but most GPU and AI libraries are built for C++ and Python."
    source: https://luajit.org/luajit.html
  - slot: wasm
    fit: weak
    reason: too-slow
    note: "Lua reaches WebAssembly by bringing its whole interpreter along, as the wasmoon project does."
    source: https://github.com/ceifa/wasmoon
  - slot: systems
    fit: none
    reason: hides-machine
    note: "Lua performs automatic memory management, so programs cannot free memory by hand as an operating system kernel does."
    source: https://www.lua.org/manual/5.4/manual.html
won_where:
  - what: "Adobe Lightroom, where over 40 percent of the code was Lua, about 100,000 lines in 2007"
    source: https://www.lua.org/doc/hopl.pdf
  - what: "LucasArts planned to replace the scripting language of Grim Fandango with Lua in 1997"
    source: https://www.lua.org/doc/hopl.pdf
  - what: "Roblox Luau, derived from Lua 5.1, is the scripting language creators use in Roblox Studio"
    source: https://create.roblox.com/docs/scripting/luau
  - what: "Redis runs Lua 5.1 scripts inside the server with atomic execution"
    source: https://redis.io/docs/latest/develop/programmability/eval-intro/
  - what: "Neovim accepts init.lua as its configuration file"
    source: https://neovim.io/doc/user/lua-guide/
  - what: "Wireshark lets users write dissectors, post-dissectors and taps in Lua"
    source: https://wiki.wireshark.org/Lua
alternatives: [javascript, python, tcl, scheme]
timeline:
  - year: 1993
    what: "Lua is born inside Tecgraf at PUC-Rio in Brazil"
    source: https://www.lua.org/doc/hopl.pdf
  - year: 1994
    what: "Lua 1.1, the first public release"
    source: https://www.lua.org/history.html
  - year: 2003
    what: "Lua 5.0 is released"
    source: https://www.lua.org/versions.html
  - year: 2006
    what: "Lua 5.1 is released"
    source: https://www.lua.org/versions.html
  - year: 2020
    what: "Lua 5.4 is released"
    source: https://www.lua.org/versions.html
  - year: 2025
    what: "Lua 5.5 is released on 22 December 2025"
    source: https://www.lua.org/versions.html
links:
