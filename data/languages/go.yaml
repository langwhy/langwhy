id: go
name: Go
appeared: 2009
creators: [Robert Griesemer, Rob Pike, Ken Thompson]
org: Google
type: backend
status: alive
tagline: "Compiled language with garbage collection and goroutines, made for networked servers and cloud tools."
hurts:
  - what: "When a Go library publishes version 2, its name changes: it gets /v2 at the end. Every program that wants the new version has to edit its own code to use the new name before it can upgrade."
    quote: "Your module's users must also update their import paths if they want to upgrade to the new major version."
    source: https://go.dev/doc/modules/major-version
  - what: "Go cleans up unused memory on its own, and does so at least every 2 minutes. In 2020 Discord found that this caused regular slowdowns in one of its busiest services, and rewrote that service in Rust."
    quote: "After digging through the Go source code, we learned that Go will force a garbage collection run every 2 minutes at minimum."
    source: https://discord.com/blog/why-discord-is-switching-from-go-to-rust
  - what: "In Go, nearly every step that can fail is followed by its own few lines that check for an error. In the Go team's 2024 survey this was the second most named challenge, picked by 13% of developers."
    quote: "The top responses in the closed-form were learning how to write Go effectively (15%) and the verbosity of error handling (13%)."
    source: https://go.dev/blog/survey2024-h1-results
born_from: >-
  In 2007 a large Google program took 45 minutes to build, and Rob Pike's account of Go's origin puts its conception during one of those builds. The team wanted fast compilation, efficient execution and ease of programming, which its FAQ says no single mainstream language offered at the time.
reacts_to: [c, cpp]
tradeoffs:
  memory: gc
  types: static
  run: native
  concurrency: [green]
  cost: "A garbage collector you cannot switch off and a deliberately small language, with fewer abstractions, in return for fast builds and code that is easy to read."
slots:
  - slot: server
    fit: strong
    note: "Google's web indexing services are written in Go."
  - slot: cli
    fit: strong
    note: "Go builds each command-line tool into one program file that needs no installed runtime."
  - slot: database
    fit: ok
    note: "CockroachDB, a distributed SQL database, is written in Go."
  - slot: wasm
    fit: ok
    note: "The standard Go compiler builds WebAssembly for browsers."
  - slot: config
    fit: ok
    note: "Pulumi programs can be written in Go, next to TypeScript, Python and Java."
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Browsers run only JavaScript and WebAssembly. Go compiles to WebAssembly, but its runtime and garbage collector come along, so even small pages get heavy."
    source: https://go.dev/wiki/WebAssembly
  - slot: systems
    fit: weak
    reason: hides-machine
    note: "Go never frees memory by hand; a garbage collector does it, and its timing is hard to predict."
    source: https://go.dev/doc/gc-guide
  - slot: mobile
    fit: weak
    reason: no-tools
    note: "Android's app tools are built for Kotlin and Java; Go is not one of their languages."
    source: https://developer.android.com/kotlin/first
  - slot: scripts
    fit: weak
    reason: overkill
    note: "go run compiles a Go program and then runs it, so a quick one-line task needs a build step first."
    source: https://pkg.go.dev/cmd/go
  - slot: data
    fit: weak
    reason: no-tools
    note: "Data analysts work in Python with packages such as NumPy; Go has few tools like them."
    source: https://numpy.org/
  - slot: compute
    fit: weak
    reason: no-tools
    note: "GPU programs are written with NVIDIA's CUDA in C++ or Python; Go reaches a GPU only through code written in those."
    source: https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html
  - slot: embedded
    fit: weak
    reason: hides-machine
    note: "Small chips run Go through TinyGo, a separate compiler, on over 150 microcontroller boards."
    source: https://tinygo.org/
  - slot: games
    fit: weak
    reason: no-tools
    note: "Unreal Engine, a major game engine, has gameplay classes written in C++, not Go."
    source: https://dev.epicgames.com/documentation/en-us/unreal-engine/programming-with-cplusplus-in-unreal-engine
won_where:
  - what: "Google's web indexing services and Chrome optimization guide service, which are written in Go"
    source: "https://go.dev/solutions/google/"
  - what: "CockroachDB, which was 89.6 percent Go code in October 2023"
    source: "https://www.cockroachlabs.com/blog/why-go-was-the-right-choice-for-cockroachdb/"
alternatives: [rust, java, csharp]
timeline:
  - year: 2007
    what: "A large Google program takes 45 minutes to build, in the account of Rob Pike"
    source: "https://go.dev/talks/2012/splash.article"
  - year: 2009
    what: "The Go project is launched publicly on 10 November 2009"
    source: "https://go.dev/blog/1year"
  - year: 2012
    what: "Go 1 is released on 28 March 2012 with a compatibility promise"
    source: "https://go.dev/doc/devel/release"
links:
