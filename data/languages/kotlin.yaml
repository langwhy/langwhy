id: kotlin
name: Kotlin
appeared: 2011
creators: [Andrey Breslav]
org: JetBrains
type: mobile
status: alive
tagline: "Statically typed language for JVM and Android apps that compiles alongside existing Java code."
born_from: >-
  In July 2011 JetBrains said that none of the existing JVM languages met its needs. Its development lead, Dmitry Jemerov, said that Scala has the right features but its most obvious deficiency is very slow compilation, so the new language had to be Java-compatible, more concise than Java and safer against null pointer errors.
reacts_to: [java, scala]
tradeoffs:
  memory: gc
  types: static
  run: vm
  concurrency: [threads, async]
  cost: "It runs on the JVM and inherits Java's startup time and memory footprint, which weighs most on short-lived scripts and small tools."
slots:
  - slot: mobile
    fit: strong
    note: "Google recommends starting new Android apps in Kotlin."
  - slot: config
    fit: strong
    note: "Gradle has made the Kotlin DSL the default for new builds."
  - slot: server
    fit: ok
    note: "Spring Boot supports Kotlin and requires Kotlin 2.2 or later."
  - slot: cli
    fit: ok
  - slot: browser
    fit: weak
    reason: runs-elsewhere
    note: "Browsers run JavaScript, so Kotlin reaches a page only through Kotlin/JS, which translates it to JavaScript."
    source: https://kotlinlang.org/docs/js-overview.html
  - slot: database
    fit: weak
    reason: runs-elsewhere
    note: "Databases are asked in SQL; Kotlin code reaches them through Exposed, a lightweight SQL library for Kotlin."
    source: https://github.com/JetBrains/Exposed
  - slot: systems
    fit: weak
    reason: hides-machine
    note: "Kotlin/Native compiles to native code but still uses a tracing garbage collector to free memory."
    source: https://kotlinlang.org/docs/native-memory-manager.html
  - slot: scripts
    fit: weak
    reason: overkill
    note: "Kotlin code is compiled into a jar that runs on Java, so a quick task needs a compile step and a Java install first."
    source: https://kotlinlang.org/docs/command-line.html
  - slot: data
    fit: weak
    reason: no-tools
    note: "NumPy, the fundamental package for scientific computing, is built for Python."
    source: https://numpy.org/
  - slot: compute
    fit: weak
    reason: no-tools
    note: "GPU programs are written with NVIDIA's CUDA in C++ or Python; Kotlin reaches a GPU only through code written in those."
    source: https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html
  - slot: wasm
    fit: weak
    reason: no-tools
    note: "Kotlin/Wasm compiles Kotlin to WebAssembly, but Kotlin's own docs still label it Beta."
    source: https://kotlinlang.org/docs/wasm-overview.html
  - slot: games
    fit: weak
    reason: no-tools
    note: "libGDX, a Java game framework, works from Kotlin, but the big engines are scripted in C# (Unity) and C++ (Unreal)."
    source: https://libgdx.com/
  - slot: embedded
    fit: none
    reason: runs-elsewhere
    note: "Kotlin/Native builds programs for Linux, Windows, Android and Apple systems; bare microcontrollers are not on its list."
    source: https://kotlinlang.org/docs/native-target-support.html
won_where:
  - what: "Android, where Google's developer guide recommends starting new apps in Kotlin"
    source: https://developer.android.com/kotlin/first
  - what: "Android, where over half of professional developers used Kotlin by May 2019"
    source: https://android-developers.googleblog.com/2019/05/google-io-2019-empowering-developers-to-build-experiences-on-Android-Play.html
  - what: "Gradle, which made the Kotlin DSL the default for new builds in 2023"
    source: https://blog.gradle.org/kotlin-dsl-is-now-the-default-for-new-gradle-builds
  - what: "Spring Boot, which supports Kotlin on the same JVM stack as Java"
    source: https://docs.spring.io/spring-boot/reference/features/kotlin.html
alternatives: [java, swift, dart, scala]
timeline:
  - year: 2011
    what: "JetBrains introduces Kotlin in July as a new language for the JVM"
    source: https://www.infoq.com/news/2011/07/kotlin/
  - year: 2016
    what: "Kotlin 1.0 ships as the first stable release, with backward compatibility promised"
    source: https://www.infoq.com/news/2016/02/jetbrains-kotlin-1/
  - year: 2017
    what: "Google adds Kotlin as an officially supported language for Android at I/O"
    source: https://www.infoq.com/news/2017/05/android-kotlin
  - year: 2019
    what: "Google makes Android development Kotlin-first in its May 2019 announcement"
    source: https://android-developers.googleblog.com/2019/05/google-io-2019-empowering-developers-to-build-experiences-on-Android-Play.html
  - year: 2023
    what: "Gradle makes the Kotlin DSL the default choice for new builds"
    source: https://blog.gradle.org/kotlin-dsl-is-now-the-default-for-new-gradle-builds
links:
  website: https://kotlinlang.org
  repo: https://github.com/JetBrains/kotlin
pldb: kotlin
sources:
