name: Weekly PLDB import

# Moves the PLDB pin to its newest commit. When the data changed and the site still validates
# and builds, commits data/pldb to main and starts the deploy (a push made with GITHUB_TOKEN does
# not start other workflows, a dispatch does).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/import-pldb.mjs --update
      - id: diff
        run: git diff --quiet data/pldb || echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.changed == 'true'
        run: pnpm validate && pnpm build
      - if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/pldb
          git commit -m "chore(data): weekly PLDB import ($(jq -r .commit data/pldb/source.json | cut -c1-7))"
          git push
          gh workflow run deploy.yml --ref main
